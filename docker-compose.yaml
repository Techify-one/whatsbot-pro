services:
  whatsbot:
    build: .
    container_name: whatsbot
    restart: unless-stopped
    expose:
      - "8080"
    # NAMED VOLUMES (não bind mounts) para os dados persistirem entre redeploys —
    # inclusive no Coolify com build pack "Docker Compose", que NÃO preserva bind
    # mounts de caminho relativo (./data) e apagaria storages/plugins + a sessão do
    # WhatsApp + a mídia a cada redeploy. Um volume nomeado é gerido pelo Docker e
    # sobrevive à recriação do container (só some com `docker compose down -v`, que
    # o Coolify não faz num redeploy normal). Ver docs/DEPLOY_COOLIFY.md.
    volumes:
      - whatsbot_storages:/app/storages
      - whatsbot_statics:/app/statics
      - whatsbot_logs:/app/logs
    environment:
      - WHATSBOT_DOCKER=1
      - WHATSBOT_WEB_PORT=${WHATSBOT_WEB_PORT:-8080}
      - WHATSBOT_GOWA_PORT=${WHATSBOT_GOWA_PORT:-64999}
      # Optional Postgres backend — unset = SQLite default in storages/whatsbot.db.
      # Example: postgresql+psycopg://whatsbot:secret@db:5432/whatsbot
      - DATABASE_URL=${DATABASE_URL:-}
    # No healthcheck here on purpose — the image already defines it in the
    # Dockerfile (HEALTHCHECK ...), and Compose inherits it. Duplicating the
    # block kept two copies of the same params drifting out of sync.

# Named volumes geridos pelo Docker — persistem entre redeploys (Coolify inclusive).
# Backup/inspeção: `docker volume inspect whatsbot-pro_whatsbot_storages` (o prefixo
# é o nome do projeto compose). NUNCA rode `docker compose down -v` em produção — o
# `-v` remove estes volumes e apaga plugins + sessão do WhatsApp + mídia.
volumes:
  whatsbot_storages:
  whatsbot_statics:
  whatsbot_logs:
