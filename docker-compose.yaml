services:
  whatsbot:
    build: .
    container_name: whatsbot
    restart: unless-stopped
    expose:
      - "8080"
    # Bind-mount real folders inside the install dir (Chatwoot-style) so the
    # database, uploaded media (statics/senditems) and logs live in visible host
    # folders that SURVIVE any container recreation / redeploy. `docker_start.sh`
    # pre-creates these dirs. Nothing shared, nothing opaque.
    volumes:
      - ./data/storages:/app/storages
      - ./data/statics:/app/statics
      - ./data/logs:/app/logs
    environment:
      - WHATSBOT_DOCKER=1
      - WHATSBOT_WEB_PORT=${WHATSBOT_WEB_PORT:-8080}
      - WHATSBOT_GOWA_PORT=${WHATSBOT_GOWA_PORT:-64999}
      # Optional Postgres backend — unset = SQLite default in storages/whatsbot.db.
      # Example: postgresql+psycopg://whatsbot:secret@db:5432/whatsbot
      - DATABASE_URL=${DATABASE_URL:-}
    # No healthcheck here on purpose — the image already defines it in the
    # Dockerfile (HEALTHCHECK ...), and Compose inherits it. Duplicating the
    # block kept two copies of the same params drifting out of sync.
