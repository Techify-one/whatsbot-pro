name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16
        # Only meaningfully used by the postgres leg; harmless for sqlite.
        env:
          POSTGRES_USER: whatsbot
          POSTGRES_PASSWORD: whatsbot
          POSTGRES_DB: whatsbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whatsbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest (SQLite)
        if: matrix.db == 'sqlite'
        run: pytest

      - name: Run pytest (Postgres)
        if: matrix.db == 'postgres'
        env:
          WHATSBOT_TEST_DB_URL: postgresql+psycopg://whatsbot:whatsbot@localhost:5432/whatsbot_test
        run: pytest
