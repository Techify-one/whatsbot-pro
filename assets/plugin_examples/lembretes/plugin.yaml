id: lembretes
name: Lembretes
version: 1.0.0
whatsbot_api_version: ">=1.0,<2.0"
description: Anota lembretes pedidos pelo contato (ex "me lembre de comprar pão") e mostra na tela com atualização em tempo real via WebSocket.
author: WhatsBot
entry:
  tools: tools
  routes: routes
migrations: migrations
screens:
  - id: lembretes-home
    title: Lembretes
    path: /lembretes
    icon: bell
    component: /plugins/lembretes/static/lembretes.js
    requires: view
permissions:
  - llm.tool
  - db.write
# RBAC de usuário (distinto do 'permissions' de capability acima): cada chave vira
# plugin.lembretes.<key> e aparece no PermissionPicker agrupada por "Plugin: Lembretes".
rbac:
  group: Lembretes
  permissions:
    - { key: view, label: "Ver lembretes" }
    - { key: delete, label: "Excluir lembretes" }
dependencies: []
