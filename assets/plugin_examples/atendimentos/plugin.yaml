id: atendimentos
name: Atendimentos
version: 1.11.0
whatsbot_api_version: ">=1.0,<2.0"
description: >-
  Camada de atendimentos sobre as conversas (estilo Chatwoot personalizado). MANTÉM o
  kanban/lista nativo e ADICIONA a entidade Atendimento, que agrupa as conversas de um
  contato (1 atendimento aberto por contato; toda conversa do contato entra nele). Assume
  a aba Atendimentos (override de rota) acrescentando a lista de atendimentos + uma entrada
  no menu da engrenagem; injeta o painel "Atendimento atual" dentro do chat (slot); abre um
  popup com campos CONFIGURÁVEIS ao resolver cada conversa (com enforcement no backend) e
  espelha esses campos em conversations.custom_attributes do core (integra conversa↔
  atendimento e sobrevive se o plugin desativar); e traz uma tela de configuração para
  criar/remover campos (texto, área, seleção, rádio, checkbox; com atalho de campos rápidos
  por CSV). Ao finalizar exige resolver a última conversa, grava o agente que resolveu e
  registra uma nota privada de abertura. Substitui e aposenta o plugin de referência Extensão
  Demo. Desative e a tela volta ao padrão — os dados ficam nas tabelas do plugin e no
  custom_attributes do core.
author: WhatsBot
entry:
  routes: routes      # REST: /api/plugins/atendimentos/...
  events: events      # message.saved / message.sent → auto-vínculo conversa↔atendimento
  filters: filters    # filter.conversation.before_status → enforcement do popup
  settings: settings  # toggles (enforce_backend, auto_link, mirror_custom_attributes)
migrations: migrations
# Override de rota + slot + popup beforeResolve vivem no extends.js (registrado 1x no boot).
frontend_extends: /plugins/atendimentos/static/extends.js
frontend_api_version: "1.0"
screens:
  # Tela de CONFIGURAÇÃO (config:true): field-builder dos rótulos + Avaliação no modal
  # "Configurar" do card. Filtrada fora do GearMenu; a lista de atendimentos vive no
  # override da aba Atendimentos.
  - id: atendimentos-config
    title: Configurar campos
    path: /atendimentos/config
    config: true
    component: /plugins/atendimentos/static/config.js
    requires: config
permissions:
  - db.write
rbac:
  group: Atendimentos
  permissions:
    - { key: view, label: "Ver atendimentos" }
    - { key: edit, label: "Editar campos/observações do atendimento" }
    - { key: manage_team_views, label: "Criar/editar visualizações de EQUIPE no Kanban" }
    - { key: resolve, label: "Fechar/reabrir atendimento e resolver conversa" }
    - { key: assign, label: "Atribuir/reatribuir atendimentos" }
    - { key: config, label: "Configurar campos e avaliação do plugin" }
    - { key: delete, label: "Excluir atendimentos" }
dependencies: []
