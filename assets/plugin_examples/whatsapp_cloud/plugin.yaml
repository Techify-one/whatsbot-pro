id: whatsapp_cloud
name: WhatsApp Cloud API
version: 1.9.0
whatsbot_api_version: ">=1.0,<2.0"
frontend_extends: /plugins/whatsapp_cloud/static/extends.js
frontend_api_version: "1.0"
description: >-
  Provider de canal para a WhatsApp Cloud API oficial da Meta (Graph API).
  Adiciona o provider "whatsapp_cloud" à tela Canais do core — sem QR, com
  suporte a templates (HSM) para mensagens fora da janela de 24h.
  A 1.9.0 para de abrir atendimento por mensagem VAZIA da Meta: de vez em
  quando a plataforma entrega no webhook uma mensagem sem texto nenhum, só com
  o aviso "Message type unknown" — o caso típico é o código de verificação do
  Facebook mandado para um número que está na API oficial. Antes isso reabria a
  conversa, marcava não lida, abria protocolo e ainda fazia a IA responder a um
  sistema da Meta. Agora nada é aberto por elas, e o registro fica no log do
  servidor (com telefone e id da mensagem). Dá para desligar, ou restringir a
  códigos específicos, no botão Configurar.
  A 1.8.0 assume o modal "Enviar template" (que era do core) e acrescenta três
  coisas nele: templates FAVORITOS por atendente (ficam no servidor, seguem o
  login em qualquer navegador e sobem para o topo da lista); ARQUIVAR os que não
  se usa mais — some da lista para todos, é reversível pela aba "Arquivadas" e
  não apaga nada na Meta, sob a permissão nova "Arquivar templates que não se
  usa mais", que nasce sem dono; e BUSCA POR CONTEÚDO, que além do nome casa
  corpo, cabeçalho, rodapé e texto/URL dos botões, sem acento e sem caixa
  ("cartao" acha "cartão") e mostrando onde casou.
short_description: >-
  Provider de canal para a WhatsApp Cloud API oficial da Meta (Graph API): sem QR e com suporte a templates (HSM) para mensagens fora da janela de 24h.
author: WhatsBot
entry:
  channels: channels
  routes: routes
  settings: settings
# Sem esta linha o migrator sai cedo e as tabelas nunca são criadas — o valor é
# o NOME DA PASTA de migrations dentro do plugin, não um booleano.
migrations: migrations
screens:
  - id: whatsapp-cloud-config
    title: WhatsApp Cloud API
    path: /whatsapp_cloud/config
    icon: cloud
    config: true
    component: /plugins/whatsapp_cloud/static/whatsapp_cloud.js
permissions:
  - channel.provider
  - net.outbound
# Permissões de USUÁRIO (RBAC), distintas das capabilities acima. O grupo casa
# com o rótulo que o core já usa para template.create/template.delete, então as
# três aparecem juntas no seletor de permissões.
# NASCE SEM DONO por decisão de produto (plano 92 · D3): nenhuma migração concede
# automaticamente — o administrador distribui em Usuários → Cargos.
rbac:
  group: "Templates (WhatsApp Cloud)"
  permissions:
    - key: template_archive
      label: "Arquivar templates que não se usa mais"
dependencies: []
