id: gowa
name: WhatsApp (GOWA)
version: 1.4.0
whatsbot_api_version: ">=1.0,<2.0"
description: >-
  Caixa de entrada WhatsApp via GOWA (go-whatsapp-web-multidevice), conectada por
  QR. O subprocesso e o polling de status/QR/avatares são donos DESTE plugin —
  desativar ou desinstalar derruba a conexão e o sistema segue rodando com as
  caixas de entrada restantes. Vem incluso e ATIVO por padrão; desinstalável pela
  tela de Plugins.
  A 1.4.0 fecha a lacuna de auditoria do plano 148: quando o Telegram promove o
  grupo de alerta a supergrupo e o chat_id muda sozinho, a atualização passa a
  deixar rastro em /audit com ator system — sem isso a trilha juraria que o
  destino dos alertas nunca mudou. Corrige também um vazamento: o texto de
  exceção ao chamar a Bot API do Telegram costuma incluir a URL completa, com o
  TOKEN — o log e o retorno de erro agora trazem só o tipo da exceção. Sem
  migração.
short_description: >-
  Caixa de entrada do WhatsApp via GOWA, conectada por QR. Vem inclusa e ativa por padrao; desativar ou desinstalar derruba a conexao, e o sistema segue com as caixas restantes.
author: WhatsBot
entry:
  channels: channels
  lifecycle: lifecycle
  routes: routes
migrations: migrations
screens:
  - id: gowa-config
    title: WhatsApp (GOWA)
    path: /gowa/config
    icon: whatsapp
    config: true
    component: /plugins/gowa/static/gowa.js
permissions:
  - channel.provider
  - process.spawn
  - runtime.task
dependencies: []
