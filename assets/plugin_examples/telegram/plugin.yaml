id: telegram
name: Canal · Telegram
version: 1.3.1
whatsbot_api_version: ">=1.0,<2.0"
description: >-
  Caixa de entrada Telegram via Bot API. Crie um bot no @BotFather, cole o token
  em um canal "telegram" na tela Canais. Recebe por long-poll (sem host público,
  ideal p/ desktop/EXE) ou por webhook. Construído 100% sobre o ponto de extensão
  de canal — prova do sistema multi-canal dinâmico, sem tocar no core.
short_description: >-
  Caixa de entrada do Telegram via Bot API: crie um bot no @BotFather e cole o token num canal 'telegram'. Recebe por long-poll ou webhook, sem tocar no core.
author: WhatsBot
entry:
  channels: channels
  lifecycle: lifecycle
  routes: routes
  settings: settings
screens:
  - id: telegram-config
    title: Telegram
    path: /telegram/config
    icon: telegram
    config: true
    component: /plugins/telegram/static/telegram.js
permissions:
  - channel.provider
  - runtime.task
  - net.outbound
dependencies: []
