id: melhorias
name: Sugestões de melhoria
version: 1.3.0
whatsbot_api_version: ">=1.0,<2.0"
description: >-
  Fluxo de aprovação + chat agêntico para melhorar as respostas da IA. O botão-direito
  numa resposta da IA ganha "Gerar melhoria": registra um PEDIDO pendente num painel de
  aprovação e posta um aviso de sistema com link. Quando alguém com permissão APROVA,
  abre um CHAT com a IA (executor Claude Code externo) que analisa o atendimento e propõe
  mudanças em agentes, prompts, tools e variáveis — cada mudança exige aprovação humana
  (✓/✕) e é versionada (dá para reverter). O painel (modelo da aba Lista de Protocolos)
  lista conteúdo da mensagem, solicitante, melhoria solicitada, link para a conversa,
  horários de solicitação/aprovação, status e aprovador — todos filtráveis — e mostra
  botões Aprovar/Recusar por linha só para quem tem permissão. A configuração do executor
  (URL, secret compartilhado, modelo e URL de callback desta instância — o executor é
  multi-instância) fica numa seção da aba "Configurações de IA" (preenchida via slot);
  dormente até configurar URL+secret. Desative o plugin e tudo some (opção do menu,
  painel, seção de IA e endpoints); os dados ficam nas tabelas do plugin.
short_description: >-
  Fluxo de aprovação + chat agêntico de melhoria (executor Claude Code externo) para respostas da IA.
author: WhatsBot
entry:
  routes: routes        # REST: /api/plugins/melhorias/... (inclui GET/PUT /config: executor agêntico)
  events: events        # app.startup: backfill one-time da config antiga do core
migrations: migrations
# Item do menu de contexto (via filter.message.contextMenu.items) + seção na aba de IA
# (via slot ai.settings.sections) vivem no extends.js (registrado 1x no boot).
frontend_extends: /plugins/melhorias/static/extends.js
frontend_api_version: "1.0"
screens:
  # Painel de aprovação (config:false) — página full-page no menu da engrenagem,
  # escondida sem a permissão `view`. Modelo da aba "Lista" de Protocolos.
  - id: melhorias-panel
    title: Sugestões de melhoria
    path: /melhorias
    config: false
    component: /plugins/melhorias/static/panel.js
    requires: view
permissions:
  - db.write
rbac:
  group: "Sugestões de melhoria"
  permissions:
    - { key: request,   label: "Solicitar sugestão de melhoria (opção no botão-direito)" }
    - { key: view,      label: "Ver o painel de aprovação e as análises geradas" }
    - { key: approve,   label: "Aprovar/recusar sugestões de melhoria" }
    - { key: configure, label: "Configurar o executor agêntico (URL/secret/modelo)" }
dependencies: []
