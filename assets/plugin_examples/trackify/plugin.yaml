id: trackify
name: Trackify (Jornada do cliente)
version: "3.2.0"
whatsbot_api_version: ">=1.0,<2.0"
description: >-
  Mostra a JORNADA do contato no Trackify (o CDP do Nexus) sem sair do atendimento:
  um botão no cabeçalho da conversa abre um modal com quem é o cliente, quanto já
  gastou, o que comprou, o que falhou, o que cancelou e quando é a próxima cobrança
  da assinatura. Fala com o Trackify EXCLUSIVAMENTE por HTTP, autenticado por API
  key emitida na tela do CDP (nada é replicado no WhatsBot). O
  casamento do contato é feito por telefone, com as variantes brasileiras (com e sem
  o 9º dígito, com e sem "+") e, quando o atendente preencheu, também por e-mail ou
  CPF — cadastro não encontrado é um estado normal e explícito, com busca manual
  dentro do próprio modal. Sem a API key configurada o plugin fica em no-op: a tela
  diz "não configurado" e nada mais acontece. Zero mudança no core.

  Desde a 1.1.0 também SINCRONIZA CAMPOS do contato nos dois sentidos: na aba
  "Campos do contato" da configuração, cada atributo personalizado do WhatsBot pode
  ser ligado a um campo personalizado do contato no Trackify, com o sentido escolhido
  por par (→, ← ou ↔). A escrita usa a API key do Trackify e não sobrescreve
  identificador (e-mail, CPF) nem apaga valor. A volta é por consulta
  periódica ao histórico de alterações do CDP, já que ele não emite webhook de
  contato. Só contatos JÁ vinculados sincronizam: esta função nunca cria cadastro no
  Trackify. Nasce desligada e em modo seco.

  Na 1.2.0 o modal passou a ter DUAS ABAS — "Jornada" (quem é o cliente e a linha
  do tempo) e "Produtos" (o que ele comprou, mais as assinaturas) — porque
  empilhar tudo numa coluna só obrigava a rolar por cima do cadastro inteiro para
  achar um produto. E a definição de compra mudou: agora sai da regra de valor do
  próprio Trackify (channel_value_rules) em vez de uma lista fixa de tipos de
  evento. Produto CANCELADO OU REEMBOLSADO CONTINUA LISTADO — se o contato
  comprou alguma vez, ele aparece, e o selo apenas rotula o último estado em vez
  de sumir com a linha. Cada produto vira uma linha só, com o número de compras e
  o total pago (descontado o reembolso, com piso em zero, igual ao CDP). Evento
  com produto vindo de um canal sem regra de valor não some calado: é reportado
  na própria aba, apontando o canal e o tipo a configurar no Trackify. Canal que
  identifica o produto só por id (o pagarme nunca preenche o nome) tem o id
  traduzido pelos outros eventos do contato e, no pior caso, mostrado cru — antes
  essas compras entravam no total gasto mas não viravam linha nenhuma.

  A lista de campos que identificam o produto é CONFIGURÁVEL (padrão:
  product_name, offer_name, product_id, offer_id), porque cada gateway do CDP
  nomeia de um jeito. Gateway novo que use um campo diferente vira configuração,
  não atualização do plugin — e quando uma cobrança não pode ser listada, a
  própria aba diz quais campos aqueles eventos trazem, apontando o slug a
  acrescentar.

  Cada produto abre o PRÓPRIO histórico ("ver histórico"): as compras daquele
  item, uma a uma, com data, valor, forma de pagamento, parcelas, cartão, id da
  transação e o que mais o gateway tiver mandado — além dos eventos de estado
  (cancelamento, atraso) que explicam o selo. É a mesma linha da aba Jornada,
  então campo novo de gateway aparece sozinho. Abre na hora, sem nova consulta.

  Na 3.0.0 o DESCADASTRO DE MARKETING POR CLIQUE EM BOTÃO virou um código só.
  Quando o contato toca um botão num canal de WhatsApp OFICIAL (provider
  whatsapp_cloud — gowa, telegram e teste nunca participam) cujo PAYLOAD é igual
  ao código configurado, o plugin grava o valor de descadastro no cadastro dele
  no Trackify. É esse mesmo campo que o módulo Campanhas de Marketing lê para
  montar a lista de disparo, então o CDP é o único ponto de encontro entre os
  dois sistemas.

  O casamento é pelo PAYLOAD porque é o Campanhas quem o define no disparo, com o
  mesmo código configurado aqui. Foi essa mudança que dissolveu a máquina da
  2.1.x — tabela de regras por botão, importação de templates, "botões vistos
  recentemente" e allow-list de canais existiam só para o operador adivinhar qual
  string a Meta devolveria. A gravação também deixou de passar por fila: acontece
  na hora do clique, com poucas tentativas internas, e o que não chega fica
  visível na própria aba para ser marcado à mão no CDP. Nasce desligada e em modo
  seco; só grava em contato JÁ vinculado a um cadastro no Trackify e nunca cria
  cadastro lá.

  Na 3.1.0 o código virou LISTA e ganhou um REGISTRO DE AÇÕES. O campo de
  descadastro aceita vários códigos separados por vírgula ("PARAR_PROMOS,
  PARAR_PROMOS_2"), e qualquer um deles descadastra — é o que permite trocar o
  código de um template sem calar o antigo, já que campanhas disparadas continuam
  recebendo cliques por dias. E o significado de um código deixou de ser
  implícito: o módulo Campanhas passou a mandar um código LIVRE por botão, sem
  saber o que ele quer dizer, e é este plugin que define a função. Hoje há uma
  ação embutida (descadastro de marketing); a aba desenha uma linha por ação
  registrada a partir do próprio servidor, então uma função nova é código Python
  e nenhuma tela. Um código que não pertence a ação nenhuma é ignorado em
  silêncio — o caso comum — e um código reivindicado por DUAS ações não vale para
  nenhuma delas, com o conflito apontado na tela em vez de resolvido a esmo.

short_description: >-
  Jornada do contato no Trackify (CDP) num modal do cabeçalho da conversa, em duas
  abas: quem é o cliente + linha do tempo, e o que ele comprou (inclusive o que
  cancelou) + assinaturas. Leitura pura.
author: WhatsBot
entry:
  routes: routes        # REST: /journey, /journey/events, /health, /outbox, /consent/status
  settings: settings    # URL do Trackify, cache, espelho, campos, consentimento
  events: events        # conversa/protocolo/contato/clique-em-botão → fila de saída
  filters: filters      # só OBSERVA quem fechou (devolve o valor intacto)
  lifecycle: lifecycle  # tarefas supervisionadas: outbox, fieldsync, pull, reconcile
migrations: migrations
# A interface de USO é o botão dentro da conversa (slot conversation.header.actions),
# registrado 1x no boot pelo extends.js. Não há página no menu.
frontend_extends: /plugins/trackify/static/extends.js
# Tela de CONFIGURAÇÃO (config:true → aparece no modal "Configurar" do card, no
# lugar do form declarativo). Existe porque a chave de ingestão precisa ser
# mascarada (o GET /settings devolve valores em claro) e porque a fila de envio
# é diagnóstico de operação, não campo de formulário.
screens:
  - id: trackify-config
    title: Trackify
    path: /trackify
    config: true
    component: /plugins/trackify/static/config.js
    requires: manage
frontend_api_version: "1.0"
permissions:
  - db.write        # fila de saída própria (plugin_trackify_*)
rbac:
  group: Trackify
  permissions:
    - { key: view,   label: "Ver a jornada do cliente no Trackify" }
    - { key: manage, label: "Configurar a integração com o Trackify" }
dependencies: []
